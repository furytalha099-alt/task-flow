name: TaskFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./test_ci.db
      SECRET_KEY: ci-test-secret-key-change-in-prod-123456
      PLATFORM_MASTER_KEY: ci-platform-master-key-32-chars-minimum!!
      REDIS_URL: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest test suite
        run: python -m pytest -v

      - name: Verify Docker image builds
        run: docker build -t taskflow-api:ci .
